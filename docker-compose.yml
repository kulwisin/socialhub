version: "3.9"

# ── Production Compose ──────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d --build
#   docker compose exec backend alembic upgrade head
#
# All secrets come from .env (root) and backend/.env — never commit those files.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sh_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: socialhub-backend:latest
    container_name: sh_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - media_data:/app/media
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
    image: socialhub-frontend:latest
    container_name: sh_frontend
    restart: always
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Nginx (reverse proxy + SSL) ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sh_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Certbot (SSL certificate renewal) ────────────────────────────────────────
  # Runs once to issue/renew certificates, then exits.
  # Trigger manually: docker compose run --rm certbot
  certbot:
    image: certbot/certbot:latest
    container_name: sh_certbot
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
    entrypoint: >
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${DOMAIN}
    profiles:
      - ssl

volumes:
  postgres_data:
    labels:
      com.socialhub.description: "PostgreSQL database files"
  media_data:
    labels:
      com.socialhub.description: "Uploaded media files"
  letsencrypt_certs:
    labels:
      com.socialhub.description: "Let's Encrypt TLS certificates"
  letsencrypt_www:
    labels:
      com.socialhub.description: "Certbot webroot challenge files"

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
